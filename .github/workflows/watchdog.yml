# Wächter v2: Stop-Loss (-10 %/1h) + Trailing-Stop (-15 % vom Hoch).
# Läuft alle 10 Minuten (bzw. per externem Trigger alle 5). In einem ÖFFENTLICHEN Repo sind
# Actions-Minuten unbegrenzt kostenlos. GitHub-Cron hat Jitter (0-15 min) —
# für Pünktlichkeit zusätzlich per externem Cron workflow_dispatch triggern:
#   curl -X POST -H "Authorization: Bearer <PAT>" \
#     -H "Accept: application/vnd.github+json" \
#     https://api.github.com/repos/<user>/<repo>/actions/workflows/watchdog.yml/dispatches \
#     -d '{"ref":"main"}'
name: watchdog

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write # zum Committen des Trailing-States (positions.json)

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm install --no-audit --no-fund
      - name: Wächter ausführen
        env:
          FAMILY_WALLET_PRIVATE_KEY: ${{ secrets.FAMILY_WALLET_PRIVATE_KEY }}
          RPC_URL: ${{ secrets.RPC_URL }}
          # Interner Poll-Loop: ~25 min lang alle 20 s Preis prüfen. Der schwere
          # RPC-Call (gehaltene Positionen) läuft nur alle 5 min → schneller
          # Preis-Check bleibt rate-limit-fest. Extern alle ~20 min triggern:
          # dank concurrency übernimmt der nächste Job nahtlos, Startup nur ~1x/25min.
          WATCHDOG_LOOP_SECONDS: "1500"
          WATCHDOG_INTERVAL_SECONDS: "20"
          WATCHDOG_RPC_REFRESH_SECONDS: "300"
        run: node watchdog.js

      - name: Trailing-State committen
        if: always()
        continue-on-error: true # ein fehlgeschlagener Push darf den Job NIE failen
        run: |
          git config user.name "watchdog"
          git config user.email "actions@github.com"
          git add positions.json
          if git diff --cached --quiet; then
            echo "keine Änderung an positions.json"
            exit 0
          fi
          git commit -m "watchdog: trailing state"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "push ok (Versuch $attempt)"
              exit 0
            fi
            echo "push-Versuch $attempt fehlgeschlagen, retry in 3s ..."
            sleep 3
          done
          echo "push nach 3 Versuchen fehlgeschlagen — ignoriert (nächster Lauf committet neu)"
          exit 0
